name = "claude-gateway"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "claude-gateway"
database_id = "local-d1"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "claude-gateway-reports"
